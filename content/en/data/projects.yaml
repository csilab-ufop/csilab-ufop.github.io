status_labels:
  active: "Ongoing"
  development: "In development"
  completed: "Completed"
items:
  - partner: "EFI Bank"
    status: "active"
    title: "AI for the Financial Sector"
    text: "**3 active R&D projects** in partnership with EFI Bank. We develop AI models for deepfake detection, fraud detection, credit analysis and customer management. Led by Prof. Gladston Moreira and Prof. Eduardo Luz."
  - partner: "CGU"
    title: "NLP Models for the Plataforma Brasil"
    text: "Development of **Natural Language Processing models** for the Comptroller General of the Union (CGU), applied to the Plataforma Brasil for automated analysis of government documents and processes."
  - partner: "Embrapii / Escola de Minas"
    title: "Industrial AI"
    text: "In partnership with Embrapii and UFOP's Escola de Minas, we develop **AI models for industrial applications**, bridging fundamental research with national industry demands."
  - partner: "BDMG"
    title: "Data Science for Credit"
    text: "Consulting in **data science and credit risk assessment** for the Minas Gerais Development Bank (BDMG), developing predictive models for portfolio analysis."
  - partner: "BDI"
    status: "development"
    title: "Credit Risk"
    text: "Project in development focused on **data science for credit risk** with BDI, expanding our activity in the financial sector with advanced machine learning techniques."
  - partner: "Embrapii - CIT/SENAI"
    status: "completed"
    title: "Development of an algorithm for the detection, classification, and proposal of corrections for defects in stamping processes"
    text: "A indústria manufatureira, em sua busca constante por otimização e garantia de qualidade, tem se voltado cada vez mais para soluções automatizadas de inspeção visual. No contexto específico da estampagem, a detecção e classificação precisa de defeitos são cruciais para garantir a integridade dos produtos e evitar falhas em etapas posteriores da produção. Tradicionalmente, essa inspeção era realizada manualmente, um processo suscetível a erros humanos e ineficiente em termos de tempo e custo. A inspeção visual automatizada, por sua vez, oferce a possibilidade de aumentar a precisão, a velocidade e a confiabilidade do processo.."
  - partner: "SixPro"
    status: "completed"
    title: "Desenvolvimento de um sistema embarcado multicâmera e interface web para inspeção, detecção e classificação de pontos de solda em peças industriais utilizando Inteligência Artificial"
    text: "Concluido"
