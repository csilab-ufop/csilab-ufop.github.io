items:
  - partner: "EFI Bank"
    status: "active"
    title: "AI for the Financial Sector"
    text: "**3 active R&D projects** in partnership with EFI Bank. We develop AI models for deepfake detection, fraud detection, credit analysis and customer management. Led by Prof. Gladston Moreira and Prof. Eduardo Luz."
  - partner: "CGU"
    title: "NLP Models for the Plataforma Brasil"
    text: "Development of **Natural Language Processing models** for the Comptroller General of the Union (CGU), applied to the Plataforma Brasil for automated analysis of government documents and processes."
  - partner: "Embrapii / Escola de Minas"
    title: "Industrial AI"
    text: "In partnership with Embrapii and UFOP's Escola de Minas, we develop **AI models for industrial applications**, bridging fundamental research with national industry demands."
  - partner: "BDMG"
    title: "Data Science for Credit"
    text: "Consulting in **data science and credit risk assessment** for the Minas Gerais Development Bank (BDMG), developing predictive models for portfolio analysis."
  - partner: "BDI"
    status: "development"
    title: "Credit Risk"
    text: "Project in development focused on **data science for credit risk** with BDI, expanding our activity in the financial sector with advanced machine learning techniques."
