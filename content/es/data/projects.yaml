status_labels:
  active: "En curso"
  development: "En desarrollo"
  completed: "Concluido"
items:
  - partner: "EFI Bank"
    status: "active"
    title: "IA para el sector financiero"
    text: "**3 proyectos de I+D activos** en asociación con EFI Bank. Desarrollamos modelos de IA para detección de deepfake, detección de fraude, análisis de crédito y gestión de clientes. Coordinación: Prof. Gladston Moreira y Prof. Eduardo Luz."
  - partner: "CGU"
    title: "Modelos de PLN para la Plataforma Brasil"
    text: "Desarrollo de modelos de **procesamiento del lenguaje natural** para la Contraloría General de la Unión (CGU), aplicados a la Plataforma Brasil para el análisis automatizado de documentos y procesos gubernamentales."
  - partner: "Embrapii / Escola de Minas"
    title: "IA industrial"
    text: "En asociación con Embrapii y la Escola de Minas de la UFOP, desarrollamos **modelos de IA para aplicaciones industriales**, integrando investigación fundamental con las demandas del sector productivo nacional."
  - partner: "BDMG"
    title: "Ciencia de datos para crédito"
    text: "Consultoría en **ciencia de datos y evaluación de riesgo crediticio** para el Banco de Desarrollo de Minas Gerais (BDMG), con desarrollo de modelos predictivos para análisis de portafolio."
  - partner: "BDI"
    status: "development"
    title: "Riesgo de crédito"
    text: "Proyecto en desarrollo orientado a la **ciencia de datos para riesgo crediticio** con el BDI, ampliando nuestra actuación en el sector financiero con técnicas avanzadas de aprendizaje automático."
