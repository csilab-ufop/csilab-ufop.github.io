items:
  - partner: "EFI Bank"
    status: "active"
    title: "IA per il settore finanziario"
    text: "**3 progetti R&S attivi** in partnership con EFI Bank. Sviluppiamo modelli di IA per rilevamento di deepfake, frodi, analisi del credito e gestione clienti. Coordinati dal Prof. Gladston Moreira e dal Prof. Eduardo Luz."
  - partner: "CGU"
    title: "Modelli NLP per la Plataforma Brasil"
    text: "Sviluppo di **modelli di elaborazione del linguaggio naturale** per il Controllore Generale dell'Unione (CGU), applicati alla Plataforma Brasil per l'analisi automatizzata di documenti e processi governativi."
  - partner: "Embrapii / Escola de Minas"
    title: "IA industriale"
    text: "In partnership con Embrapii e la Escola de Minas dell'UFOP, sviluppiamo **modelli di IA per applicazioni industriali**, collegando la ricerca fondamentale alle esigenze dell'industria nazionale."
  - partner: "BDMG"
    title: "Data science per il credito"
    text: "Consulenza in **data science e valutazione del rischio di credito** per la Banca di Sviluppo di Minas Gerais (BDMG), sviluppando modelli predittivi per l'analisi del portafoglio."
  - partner: "BDI"
    status: "development"
    title: "Rischio di credito"
    text: "Progetto in sviluppo focalizzato sulla **data science per il rischio di credito** con BDI, espandendo la nostra attività nel settore finanziario con tecniche avanzate di machine learning."
