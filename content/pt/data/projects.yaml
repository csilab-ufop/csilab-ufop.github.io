status_labels:
  active: "Em andamento"
  development: "Em desenvolvimento"
  completed: "Concluído"
items:
  - partner: "EFI Bank"
    status: "active"
    title: "IA para o Setor Financeiro"
    text: "**3 projetos de P&D ativos** em parceria com o EFI Bank. Desenvolvemos modelos de IA para detecção de deepfake, detecção de fraude, análise de crédito e gerenciamento de clientes. Coordenação: Prof. Gladston Moreira e Prof. Eduardo Luz."
  - partner: "CGU"
    title: "Modelos de PLN para a Plataforma Brasil"
    text: "Desenvolvimento de modelos de **Processamento de Linguagem Natural** para a Controladoria-Geral da União (CGU), aplicados à Plataforma Brasil para análise automatizada de documentos e processos governamentais."
  - partner: "Embrapii / Escola de Minas"
    title: "IA Industrial"
    text: "Em parceria com a Embrapii e a Escola de Minas da UFOP, desenvolvemos **modelos de IA para aplicações industriais**, integrando pesquisa fundamental com demandas do setor produtivo nacional."
  - partner: "BDMG"
    title: "Ciência de Dados para Crédito"
    text: "Consultoria em **ciência de dados e avaliação de risco de crédito** para o Banco de Desenvolvimento de Minas Gerais (BDMG), com desenvolvimento de modelos preditivos para análise de portfólio."
  - partner: "BDI"
    status: "development"
    title: "Risco de Crédito"
    text: "Projeto em desenvolvimento voltado à **ciência de dados para risco de crédito** com o BDI, expandindo nossa atuação no setor financeiro com técnicas avançadas de aprendizado de máquina."
