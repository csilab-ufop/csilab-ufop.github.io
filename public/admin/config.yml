# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS for csilab.ufop.br, served at /admin/ (tested with @sveltia/cms 0.248.0, pinned in
# index.html). How editors sign in and how saving works: README.md, "Editing content".
#
# Rules for whoever edits this file:
# - Sveltia rewrites a whole file on save and writes its keys in the order of the fields below.
#   Keep the fields in the same order as the keys in the content files and cover every key, so a
#   save changes nothing but the edited value. Keys missing here are kept, but moved to the end of
#   their object in alphabetical order on the first save, and they can't be edited in the CMS.
#   Page files list their keys in page order, top to bottom. `npm run check:content` verifies
#   coverage and order (section 10 of scripts/check-content.js).
# - Texts with a placeholder ({n}, {name}, {total}, {date}, {year}, {source}, {first}, {last})
#   carry a `pattern` that requires it, so a save can't drop it in any language.
# - Lists have a `summary` and `collapsed: auto`.
# - One file per language (content/{{locale}}/...). Translated fields need `i18n: true`, nested
#   ones included (it is not inherited). `i18n: duplicate` = same value in all four files, edited
#   in Portuguese only and read-only in the other languages. A list with a duplicated subfield is
#   "paired": adding, removing or moving an item in Portuguese does the same in every language.
# - Labels and hints are in Portuguese (the editors are Brazilian). Hints are inline Markdown, so
#   Markdown examples go between backticks.
# - content/_shared/data/publications.json is generated weekly from Google Scholar
#   (scripts/fetch-publications.js) and is deliberately not editable here.

backend:
  name: github
  repo: csilab-ufop/csilab-ufop.github.io
  branch: main
  auth_methods: [token]

app_title: CSI Lab · CMS
logo:
  src: /favicon.svg

media_folder: public/images
public_folder: /images
media_libraries:
  all:
    slugify_filename: true
    transformations:
      raster_image: {format: webp, quality: 85, width: 2000, height: 2000}
      svg: {optimize: true}

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 60

i18n:
  locales: [pt, en, es, it]
  default_locale: pt
  omit_default_locale_from_preview_path: true

editor:
  preview: false

output:
  omit_empty_optional_fields: true
  yaml:
    quote: double
    indent_size: 2
    indent_sequences: true

collections:
  # ── Páginas: front matter of content/{{locale}}/<page>.md ─────────────────────────────────────
  - name: paginas
    label: Páginas
    label_singular: Página
    icon: web
    description: "Textos fixos de cada página do site: títulos, subtítulos, rótulos das seções, botões e SEO. O português fica à esquerda e cada tradução à direita."
    i18n: true
    files:
      - name: index
        label: Início
        icon: home
        file: content/{{locale}}/index.md
        preview_path: /{{locale}}/
        i18n: true
        fields:
          - {name: title, label: "Título da página (SEO)", hint: "Aparece na aba do navegador e nos resultados de busca.", i18n: true}
          - {name: description, label: "Descrição (SEO)", widget: text, hint: "Resumo de uma ou duas frases para buscadores e redes sociais (até ~160 caracteres). Também é a descrição do laboratório nos dados estruturados da página inicial.", i18n: true}
          - {name: hero_eyebrow, label: "Abertura › linha acima do título", i18n: true}
          - {name: hero_title, label: "Abertura › título", hint: "Título principal (h1) da página inicial; também é o nome do laboratório nos dados estruturados para buscadores.", i18n: true}
          - {name: hero_sub, label: "Abertura › subtítulo", widget: text, i18n: true}
          - {name: hero_cta_primary, label: "Abertura › botão principal", hint: "Leva à página Pesquisa.", i18n: true}
          - {name: hero_cta_secondary, label: "Abertura › botão secundário", hint: "Leva à página Contato.", i18n: true}
          - {name: stats_title, label: "Números › título (leitor de tela)", hint: "Título da faixa de números, lido só por leitores de tela. Os números ficam em Conteúdo › Números da página inicial.", i18n: true}
          - {name: about_label, label: "Sobre › rótulo", hint: "Texto curto acima do título da seção.", i18n: true}
          - {name: about_title, label: "Sobre › título", i18n: true}
          - {name: about_p1, label: "Sobre › 1º parágrafo", widget: markdown, buttons: [bold, italic, link], editor_components: [], minimal: true, hint: "Um parágrafo. Markdown: `**negrito**`, `_itálico_`, `[link](https://…)`.", i18n: true}
          - {name: about_p2, label: "Sobre › 2º parágrafo", widget: text, i18n: true}
          - {name: about_feature1_title, label: "Sobre › destaque 1 › título", i18n: true}
          - {name: about_feature1_text, label: "Sobre › destaque 1 › texto", widget: text, i18n: true}
          - {name: about_feature2_title, label: "Sobre › destaque 2 › título", i18n: true}
          - {name: about_feature2_text, label: "Sobre › destaque 2 › texto", widget: text, i18n: true}
          - {name: about_cta, label: "Sobre › link para a página Equipe", i18n: true}
          - {name: about_photo_alt, label: "Sobre › descrição da foto da equipe", widget: text, hint: "Texto alternativo para leitores de tela: descreva o que a foto mostra.", i18n: true}
          - {name: about_years_label, label: "Sobre › legenda do selo de anos", hint: "O número vem de Configurações › Site › Anos de pesquisa.", i18n: true}
          - {name: about_event1_alt, label: "Sobre › descrição da foto do Encontro de Saberes 2023", widget: text, hint: "Texto alternativo para leitores de tela.", i18n: true}
          - {name: about_event2_alt, label: "Sobre › descrição da foto do ERCAS 2024", widget: text, hint: "Texto alternativo para leitores de tela.", i18n: true}
          - {name: research_label, label: "Pesquisa › rótulo", hint: "As áreas ficam em Conteúdo › Áreas de pesquisa.", i18n: true}
          - {name: research_title, label: "Pesquisa › título", i18n: true}
          - {name: research_sub, label: "Pesquisa › subtítulo", widget: text, i18n: true}
          - {name: research_cta, label: "Pesquisa › link para a página Pesquisa", i18n: true}
          - {name: pubs_label, label: "Publicações › rótulo", hint: "As publicações vêm do Google Scholar, atualizadas toda semana.", i18n: true}
          - {name: pubs_title, label: "Publicações › título", i18n: true}
          - {name: pubs_sub, label: "Publicações › subtítulo", widget: text, i18n: true}
          - {name: pubs_latest, label: "Publicações › título da coluna “mais recentes”", i18n: true}
          - {name: pubs_fig_label, label: "Publicações › marcador do gráfico", hint: "Ex.: FIG. 03.", i18n: true}
          - {name: pubs_fig_caption, label: "Publicações › legenda do gráfico de artigos por ano", pattern: ['^(?=.*[{]first[}])(?=.*[{]last[}])', "Mantenha {first} e {last}"], hint: "Mantenha `{first}` e `{last}`: o site troca pelo primeiro e pelo último ano do gráfico.", i18n: true}
          - {name: pubs_fig_partial, label: "Publicações › aviso do ano em curso no gráfico", pattern: ['[{]year[}]', "Mantenha {year}"], hint: "Mantenha `{year}`: o site troca pelo ano atual, cujos dados ainda são parciais.", i18n: true}
          - {name: pubs_papers, label: "Publicações › palavra depois do total de artigos", hint: "Ex.: artigos (o site mostra “250 artigos”).", i18n: true}
          - {name: pubs_citations, label: "Publicações › palavra depois do total de citações", hint: "Ex.: citações. Também aparece depois do número de citações de cada artigo da coluna “mais citados”.", i18n: true}
          - {name: pubs_source, label: "Publicações › fonte e data da atualização", pattern: ['[{]date[}]', "Mantenha {date}"], hint: "Mantenha `{date}`: o site troca pela data da última atualização.", i18n: true}
          - {name: pubs_cta, label: "Publicações › link para a página Publicações", i18n: true}
          - {name: pubs_cited, label: "Publicações › título da coluna “mais citados”", i18n: true}
          - {name: news_label, label: "Notícias › rótulo", hint: "A seção mostra a notícia em destaque e as mais recentes do menu Notícias.", i18n: true}
          - {name: news_title, label: "Notícias › título", i18n: true}
          - {name: news_sub, label: "Notícias › subtítulo", widget: text, i18n: true}
          - {name: news_cta, label: "Notícias › link para a página Notícias", i18n: true}
          - {name: partners_label, label: "Parceiros › rótulo", hint: "Os parceiros vêm de Conteúdo › Projetos de P&D.", i18n: true}
          - {name: partners_title, label: "Parceiros › título", i18n: true}
          - {name: partners_sub, label: "Parceiros › subtítulo", widget: text, i18n: true}
          - {name: partners_cta, label: "Parceiros › link para os projetos de P&D", hint: "Leva à seção Projetos da página Pesquisa.", i18n: true}
          - {name: join_title, label: "Chamada final › título", i18n: true}
          - {name: join_text, label: "Chamada final › texto", widget: text, i18n: true}
          - {name: join_cta, label: "Chamada final › botão", hint: "Leva à página Contato.", i18n: true}

      - name: pesquisa
        label: Pesquisa
        icon: science
        file: content/{{locale}}/pesquisa.md
        preview_path: /{{locale}}/pesquisa/
        i18n: true
        fields:
          - {name: title, label: "Título da página (SEO)", hint: "Aparece na aba do navegador e nos resultados de busca.", i18n: true}
          - {name: description, label: "Descrição (SEO)", widget: text, hint: "Resumo de uma ou duas frases para buscadores e redes sociais (até ~160 caracteres).", i18n: true}
          - {name: page_label, label: "Cabeçalho › rótulo", hint: "Texto curto acima do título da página.", i18n: true}
          - {name: page_title, label: "Cabeçalho › título", i18n: true}
          - {name: page_sub, label: "Cabeçalho › subtítulo", widget: text, i18n: true}
          - {name: nav_label, label: "Atalhos da página › nome (leitor de tela)", hint: "Nome da barra de atalhos para as seções, lido por leitores de tela.", i18n: true}
          - {name: nav_areas, label: "Atalhos da página › Áreas", i18n: true}
          - {name: nav_projects, label: "Atalhos da página › Projetos", i18n: true}
          - {name: nav_open, label: "Atalhos da página › Ciência aberta", i18n: true}
          - {name: areas_label, label: "Áreas › rótulo", hint: "As áreas ficam em Conteúdo › Áreas de pesquisa. Também é o título do índice no cabeçalho (telas largas).", i18n: true}
          - {name: areas_title, label: "Áreas › título", i18n: true}
          - {name: areas_sub, label: "Áreas › subtítulo", widget: text, i18n: true}
          - {name: area_topics_label, label: "Áreas › rótulo acima das tags de cada área", i18n: true}
          - {name: area_people_label, label: "Áreas › rótulo acima dos pesquisadores de cada área", hint: "Os pesquisadores aparecem pelas tags em comum (Equipe › Membros e Conteúdo › Áreas de pesquisa).", i18n: true}
          - {name: projects_label, label: "Projetos › rótulo", hint: "Os projetos ficam em Conteúdo › Projetos de P&D.", i18n: true}
          - {name: projects_title, label: "Projetos › título", i18n: true}
          - {name: projects_sub, label: "Projetos › subtítulo", widget: text, i18n: true}
          - {name: open_label, label: "Ciência aberta › rótulo", i18n: true}
          - {name: open_title, label: "Ciência aberta › título", i18n: true}
          - {name: open_text, label: "Ciência aberta › texto", widget: text, i18n: true}
          - {name: open_cta_publications, label: "Ciência aberta › botão para Publicações", i18n: true}
          - {name: open_cta_github, label: "Ciência aberta › botão para o GitHub", hint: "O endereço vem de Configurações › Site › Redes sociais (GitHub).", i18n: true}
          - {name: open_stat_value, label: "Ciência aberta › número em destaque", pattern: ['^[0-9]+$', "Só o número, ex.: 14"], hint: "Só o número, igual em todos os idiomas, ex.: 14.", i18n: duplicate}
          - {name: open_stat_label, label: "Ciência aberta › legenda do número", i18n: true}
          - {name: open_pubs_label, label: "Ciência aberta › legenda do total de publicações", hint: "O número vem do Google Scholar.", i18n: true}
          - {name: open_cites_label, label: "Ciência aberta › legenda do total de citações", hint: "O número vem do Google Scholar.", i18n: true}
          - {name: open_chart_label, label: "Ciência aberta › legenda do gráfico", i18n: true}
          - {name: open_chart_partial, label: "Ciência aberta › marca do ano em curso no gráfico", hint: "Palavra curta, ex.: parcial (os dados do ano atual ainda estão incompletos).", i18n: true}
          - {name: cta_title, label: "Chamada final › título", i18n: true}
          - {name: cta_text, label: "Chamada final › texto", widget: text, i18n: true}
          - {name: cta_button, label: "Chamada final › botão", hint: "Leva à página Contato.", i18n: true}

      - name: equipe
        label: Equipe
        icon: groups
        file: content/{{locale}}/equipe.md
        preview_path: /{{locale}}/equipe/
        i18n: true
        fields:
          - {name: title, label: "Título da página (SEO)", hint: "Aparece na aba do navegador e nos resultados de busca.", i18n: true}
          - {name: description, label: "Descrição (SEO)", widget: text, hint: "Resumo de uma ou duas frases para buscadores e redes sociais (até ~160 caracteres).", i18n: true}
          - {name: page_label, label: "Cabeçalho › rótulo", hint: "Texto curto acima do título da página.", i18n: true}
          - {name: page_title, label: "Cabeçalho › título", i18n: true}
          - {name: page_sub, label: "Cabeçalho › subtítulo", widget: text, i18n: true}
          - {name: nav_label, label: "Barra de grupos › nome (leitor de tela)", hint: "Nome da barra de atalhos para os grupos, lido por leitores de tela. Os atalhos Coordenadores, Docentes, Colaboradores e Egressos usam os nomes de Conteúdo › Textos da interface › Rodapé › Links para os grupos.", i18n: true}
          - {name: nav_graduate, label: "Barra de grupos › atalho Pós-graduandos", i18n: true}
          - {name: nav_undergrad, label: "Barra de grupos › atalho Graduandos", i18n: true}
          - {name: count_one, label: "Contagem › 1 pessoa (singular)", pattern: ['[{]n[}]', "Mantenha {n}"], hint: "Mantenha `{n}`: o site troca pelo número de pessoas do grupo.", i18n: true}
          - {name: count_other, label: "Contagem › pessoas (plural)", pattern: ['[{]n[}]', "Mantenha {n}"], hint: "Mantenha `{n}`: o site troca pelo número de pessoas do grupo.", i18n: true}
          - {name: email_short, label: "Links dos membros › “E-mail” (dica do ícone)", hint: "Aparece ao passar o mouse sobre o ícone.", i18n: true}
          - {name: email_label, label: "Links dos membros › e-mail (leitor de tela)", pattern: ['[{]name[}]', "Mantenha {name}"], hint: "Mantenha `{name}`: o site troca pelo nome da pessoa.", i18n: true}
          - {name: scholar_label, label: "Links dos membros › Google Scholar (leitor de tela)", pattern: ['[{]name[}]', "Mantenha {name}"], hint: "Mantenha `{name}`: o site troca pelo nome da pessoa.", i18n: true}
          - {name: lattes_label, label: "Links dos membros › Lattes (leitor de tela)", pattern: ['[{]name[}]', "Mantenha {name}"], hint: "Mantenha `{name}`: o site troca pelo nome da pessoa.", i18n: true}
          - {name: website_short, label: "Links dos membros › “Site” (dica do ícone)", hint: "Aparece ao passar o mouse sobre o ícone e ao lado do link nos cartões dos coordenadores.", i18n: true}
          - {name: website_label, label: "Links dos membros › site pessoal (leitor de tela)", pattern: ['[{]name[}]', "Mantenha {name}"], hint: "Mantenha `{name}`: o site troca pelo nome da pessoa.", i18n: true}
          - {name: tags_label, label: "Tags dos membros › nome da lista (leitor de tela)", hint: "Ex.: Interesses de pesquisa.", i18n: true}
          - {name: join_text, label: "Chamada final › título", i18n: true}
          - {name: join_sub, label: "Chamada final › texto", widget: text, i18n: true}
          - {name: join_ic_title, label: "Chamada final › passo 1 › título", hint: "Ex.: Iniciação Científica.", i18n: true}
          - {name: join_ic_text, label: "Chamada final › passo 1 › texto", widget: text, i18n: true}
          - {name: join_ms_title, label: "Chamada final › passo 2 › título", hint: "Ex.: Mestrado.", i18n: true}
          - {name: join_ms_text, label: "Chamada final › passo 2 › texto", widget: text, i18n: true}
          - {name: join_phd_title, label: "Chamada final › passo 3 › título", hint: "Ex.: Doutorado.", i18n: true}
          - {name: join_phd_text, label: "Chamada final › passo 3 › texto", widget: text, i18n: true}
          - {name: join_btn, label: "Chamada final › botão", hint: "Leva à seção Como ingressar da página Contato.", i18n: true}

      - name: publicacoes
