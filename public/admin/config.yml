  # ── Notícias: content/{{locale}}/news/<slug>.md, same file name in every language ─────────────
  - name: noticias
    label: Notícias
    label_singular: Notícia
    icon: newspaper
    description: "Notícias, eventos e premiações, da mais nova para a mais antiga. Data, categoria, destaque, link e imagem valem para os quatro idiomas e são editados em português; título e textos são traduzidos."
    folder: content/{{locale}}/news
    i18n: true
    create: true
    slug:
      template: "{{title}}"
      editable: [create]
      hint: "Nome do arquivo e âncora da notícia (/noticias/#…), o mesmo nos quatro idiomas. Não pode ser mudado depois de criado."
    summary: "{{title}} · {{date}}"
    sortable_fields:
      fields: [date, title]
      default: {field: date, direction: descending}
    preview_path: /{{locale}}/noticias/#{{slug}}
    aliases_field: false
    fields:
      - {name: title, label: "Título", i18n: true}
      - name: date
        label: "Data"
        hint: "Formato AAAA-MM-DD, ou só AAAA-MM ou AAAA quando o dia (ou o mês) não importa. Define a ordem das notícias."
        pattern: ['^\d{4}(-(0[1-9]|1[0-2])(-(0[1-9]|[12]\d|3[01]))?)?$', "Use AAAA, AAAA-MM ou AAAA-MM-DD, ex.: 2024-12-13"]
        i18n: duplicate
      - name: category
        label: "Categoria"
        widget: select
        options:
          - {label: "Premiação", value: award}
          - {label: "Conferência", value: conference}
          - {label: "Publicação", value: publication}
          - {label: "Projeto", value: project}
          - {label: "Evento", value: event}
          - {label: "Código aberto", value: open_source}
        hint: "Os nomes exibidos no site (e traduzidos) ficam em Conteúdo › Textos da interface. Premiações também aparecem na seção de prêmios."
        i18n: duplicate
      - name: featured
        label: "Em destaque"
        widget: boolean
        default: false
        required: false
        hint: "A notícia em destaque mais recente abre a página Notícias e aparece na página inicial."
        i18n: duplicate
      - {name: event, label: "Evento", required: false, hint: "Opcional: nome do evento ou da premiação, ex.: IEEE LACCI 2024.", i18n: true}
      - {name: location, label: "Local", required: false, hint: "Opcional, ex.: Bogotá, Colômbia.", i18n: true}
      - {name: highlight, label: "Frase em evidência", required: false, hint: "Opcional: frase curta em evidência, ex.: 3 artigos aceitos. Se começar com um número, o número aparece em destaque, grande, na página Notícias e na página inicial.", i18n: true}
      - {name: link, label: "Link", required: false, pattern: ['^https?://', "Comece com https://"], hint: "Opcional: endereço completo (https://…) para saber mais.", i18n: duplicate}
      - name: image
        label: "Imagem"
        widget: image
        required: false
        choose_url: false
        accept: image/*
        media_folder: /public/images/news
        public_folder: /images/news
        media_libraries:
          all:
            transformations:
              raster_image: {format: webp, quality: 82, width: 1600, height: 1600}
        hint: "Opcional. Convertida para WebP (até 1600 px) ao salvar."
        i18n: duplicate
      - {name: image_alt, label: "Descrição da imagem", required: false, hint: "Texto alternativo para leitores de tela: descreva o que a imagem mostra.", i18n: true}
      - {name: summary, label: "Resumo", widget: markdown, buttons: [bold, italic, link], editor_components: [], minimal: true, hint: "Um parágrafo curto, mostrado nos cartões. Markdown: `**negrito**`, `_itálico_`, `[link](https://…)`.", i18n: true}
      - {name: body, label: "Texto completo", widget: markdown, buttons: [bold, italic, link, bulleted-list, numbered-list], editor_components: [], required: false, hint: "Opcional: detalhes, lista de artigos etc.", i18n: true}

  # ── Conteúdo: per-language data files content/{{locale}}/data/*.yaml ──────────────────────────
  - name: conteudo
    label: Conteúdo
    label_singular: Conteúdo
    icon: dataset
    description: "Listas e textos usados em várias páginas: áreas de pesquisa, projetos, números, perguntas frequentes, contato, textos da interface e da equipe."
    i18n: true
    files:
      - name: research
        label: "Áreas de pesquisa"
        icon: science
        file: content/{{locale}}/data/research.yaml
        preview_path: /{{locale}}/pesquisa/
        i18n: true
        fields:
          - name: areas
            label: "Áreas de pesquisa"
            label_singular: "Área"
            widget: list
            root: true
            map_key_field: id
            summary: "{{title}}"
            collapsed: auto
            hint: "A ordem aqui é a ordem no site. Adicionar, remover ou mover uma área em português faz o mesmo nas traduções."
            i18n: true
            fields:
              - {name: id, label: "Identificador", pattern: ['^[a-z][a-z0-9_]*$', "Só letras minúsculas, números e _"], hint: "Curto, sem espaços nem acentos, ex.: vision.", i18n: duplicate}
              - name: icon
                label: "Ícone"
                widget: select
                options:
                  - {label: "Chip (cpu)", value: cpu}
                  - {label: "Olho (eye)", value: eye}
                  - {label: "Camadas (layers)", value: layers}
                  - {label: "Balão de conversa (message)", value: message}
                  - {label: "Gráfico de barras (bar-chart)", value: bar-chart}
                  - {label: "Mapa (map)", value: map}
                  - {label: "Batimento (activity)", value: activity}
                  - {label: "Controles (sliders)", value: sliders}
                  - {label: "Brilho (sparkles)", value: sparkles}
                  - {label: "Globo (globe)", value: globe}
                  - {label: "Código (code)", value: code}
                  - {label: "Pessoas (users)", value: users}
                  - {label: "Livro (book)", value: book}
                  - {label: "Lupa (search)", value: search}
                i18n: duplicate
              - {name: tags, label: "Tags dos pesquisadores", widget: relation, multiple: true,
                 collection: equipe, file: team_tags, value_field: "{{tags.*.id}}",
                 display_fields: ["{{tags.*.pt}}"], search_fields: ["{{tags.*.pt}}", "{{tags.*.en}}", "{{tags.*.id}}"],
                 hint: "Os membros com alguma destas tags aparecem como pesquisadores da área. Novas tags: Equipe › Tags de pesquisa.", i18n: duplicate}
              - {name: title, label: "Título", i18n: true}
              - {name: text, label: "Descrição", widget: text, i18n: true}

      - name: projects
        label: "Projetos de P&D"
        icon: handshake
        file: content/{{locale}}/data/projects.yaml
        preview_path: /{{locale}}/pesquisa/#consultorias
        i18n: true
        fields:
          - name: status_labels
            label: "Nomes das situações"
            widget: object
            hint: "Como cada situação aparece no site."
            i18n: true
            fields:
              - {name: active, label: "Em andamento", i18n: true}
              - {name: development, label: "Em desenvolvimento", i18n: true}
              - {name: completed, label: "Concluído", i18n: true}
          - name: items
            label: "Projetos"
            label_singular: "Projeto"
            widget: list
            summary: "{{partner}} — {{title}}"
            collapsed: auto
            hint: "Adicionar, remover ou mover um projeto em português faz o mesmo nas traduções."
            i18n: true
            fields:
              - {name: partner, label: "Parceiro", hint: "Ex.: EFI Bank.", i18n: duplicate}
              - name: status
                label: "Situação"
                widget: select
                required: false
                options:
                  - {label: "Em andamento", value: active}
                  - {label: "Em desenvolvimento", value: development}
                  - {label: "Concluído", value: completed}
                hint: "Opcional."
                i18n: duplicate
              - {name: link, label: "Link", required: false, pattern: ['^https?://', "Comece com https://"], hint: "Opcional: endereço completo (https://…).", i18n: duplicate}
              - {name: title, label: "Título", i18n: true}
              - {name: text, label: "Descrição", widget: markdown, buttons: [bold, italic, link], editor_components: [], minimal: true, hint: "Um parágrafo. Markdown: `**negrito**`, `_itálico_`, `[link](https://…)`.", i18n: true}

      - name: counters
        label: "Números da página inicial"
        icon: pin
        file: content/{{locale}}/data/counters.yaml
        preview_path: /{{locale}}/#numeros
        i18n: true
        fields:
          - name: counters
            label: "Números"
            label_singular: "Número"
            widget: list
            root: true
            map_key_field: id
            summary: "{{label}}"
            collapsed: auto
            hint: "Mostrados nesta ordem na faixa de números da página inicial."
            i18n: true
            fields:
              - {name: id, label: "Identificador", pattern: ['^[a-z][a-z0-9_]*$', "Só letras minúsculas, números e _"], hint: "Curto, sem espaços nem acentos, ex.: alumni.", i18n: duplicate}
              - name: source
                label: "Origem do valor"
                widget: select
                options:
                  - {label: "Valor fixo (preencha o campo Valor)", value: manual}
                  - {label: "Publicações (contadas automaticamente)", value: publications}
                  - {label: "Citações (contadas automaticamente)", value: citations}
                  - {label: "Professores e pesquisadores (contados na equipe)", value: faculty}
                  - {label: "Estudantes (contados na equipe)", value: students}
                i18n: duplicate
              - {name: value, label: "Valor", widget: number, value_type: int, required: false, hint: "Só para “Valor fixo”.", i18n: duplicate}
              - {name: suffix, label: "Sufixo", required: false, hint: "Opcional, ex.: + (aparece depois do número).", i18n: duplicate}
              - {name: label, label: "Legenda", i18n: true}

      - name: faq
        label: "Perguntas frequentes"
        icon: quiz
        file: content/{{locale}}/data/faq.yaml
        preview_path: /{{locale}}/contato/#faq
        i18n: true
        fields:
          - name: items
            label: "Perguntas"
            label_singular: "Pergunta"
            widget: list
            summary: "{{question}}"
            collapsed: auto
            hint: "Adicionar, remover ou mover uma pergunta em português faz o mesmo nas traduções."
            i18n: true
            fields:
