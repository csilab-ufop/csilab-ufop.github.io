          - {name: description, label: "Descrição (SEO)", widget: text, hint: "Resumo de uma ou duas frases para buscadores e redes sociais (até ~160 caracteres).", i18n: true}
          - {name: page_label, label: "Cabeçalho › rótulo", hint: "Texto curto acima do título da página.", i18n: true}
          - {name: page_title, label: "Cabeçalho › título", i18n: true}
          - {name: page_sub, label: "Cabeçalho › subtítulo", widget: text, hint: "As publicações vêm do Google Scholar e são atualizadas toda semana; não há como editá-las aqui.", i18n: true}
          - {name: meta_source, label: "Cabeçalho › fonte dos dados", pattern: ['[{]source[}]', "Mantenha {source}"], hint: "Mantenha `{source}`: o site troca por “Google Scholar”.", i18n: true}
          - {name: meta_updated, label: "Cabeçalho › data da atualização", pattern: ['[{]date[}]', "Mantenha {date}"], hint: "Mantenha `{date}`: o site troca pela data da última atualização.", i18n: true}
          - {name: code_note, label: "Cabeçalho › nota sobre o código-fonte", hint: "Frase que vem antes do link para o GitHub, sem ponto final.", i18n: true}
          - {name: stat_papers_label, label: "Números › legenda dos artigos", i18n: true}
          - {name: stat_citations_label, label: "Números › legenda das citações", i18n: true}
          - {name: stat_period_label, label: "Números › legenda do período", i18n: true}
          - {name: overview_label, label: "Panorama › rótulo", i18n: true}
          - {name: overview_title, label: "Panorama › título", i18n: true}
          - {name: overview_sub, label: "Panorama › subtítulo", widget: text, i18n: true}
          - {name: chart_papers_label, label: "Gráficos › título do gráfico de artigos por ano", i18n: true}
          - {name: chart_cites_label, label: "Gráficos › título do gráfico de citações", i18n: true}
          - {name: chart_partial, label: "Gráficos › aviso do ano em curso", pattern: ['[{]year[}]', "Mantenha {year}"], hint: "Mantenha `{year}`: o site troca pelo ano atual.", i18n: true}
          - {name: partial_short, label: "Gráficos › marca do ano em curso", hint: "Palavra curta, ex.: parcial. Aparece na tabela de dados e na descrição das barras para leitores de tela.", i18n: true}
          - {name: bar_hint, label: "Gráficos › dica das barras (leitor de tela)", hint: "Explica que cada barra leva às publicações daquele ano.", i18n: true}
          - {name: year_label, label: "Busca › “Ano”", hint: "Nome do filtro de ano.", i18n: true}
          - {name: archive_label, label: "Arquivo › rótulo", i18n: true}
          - {name: archive_title, label: "Arquivo › título", i18n: true}
          - {name: archive_sub, label: "Arquivo › subtítulo", widget: text, i18n: true}
          - {name: search_label, label: "Busca › nome do campo (leitor de tela)", i18n: true}
          - {name: search_placeholder, label: "Busca › texto de exemplo dentro do campo", i18n: true}
          - {name: year_all, label: "Busca › opção “todos os anos”", i18n: true}
          - {name: clear_label, label: "Busca › botão “limpar filtros”", i18n: true}
          - {name: results_all, label: "Busca › contagem sem filtro", pattern: ['[{]total[}]', "Mantenha {total}"], hint: "Mantenha `{total}`: o número de publicações.", i18n: true}
          - {name: results_some, label: "Busca › contagem com filtro", pattern: ['^(?=.*[{]n[}])(?=.*[{]total[}])', "Mantenha {n} e {total}"], hint: "Mantenha `{n}` (encontradas) e `{total}` (todas).", i18n: true}
          - {name: results_none, label: "Busca › nenhum resultado (título)", i18n: true}
          - {name: empty_text, label: "Busca › nenhum resultado (texto)", widget: text, i18n: true}
          - {name: empty_data, label: "Aviso quando a lista de publicações não está disponível", widget: text, i18n: true}
          - {name: count_of, label: "Contagem › “n de total”", pattern: ['^(?=.*[{]n[}])(?=.*[{]total[}])', "Mantenha {n} e {total}"], hint: "Mantenha `{n}` e `{total}`.", i18n: true}
          - {name: papers_one, label: "Contagem › 1 artigo (singular)", pattern: ['[{]n[}]', "Mantenha {n}"], hint: "Mantenha `{n}`: o site troca pelo número.", i18n: true}
