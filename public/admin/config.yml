  # ── Equipe: language-independent files in content/_shared/data ────────────────────────────────
  - name: equipe
    label: Equipe
    label_singular: Equipe
    icon: groups
    description: "Membros do laboratório e tags de pesquisa (com os nomes nos quatro idiomas), num arquivo único para todos os idiomas. As publicações do site são buscadas toda semana nos perfis do Google Scholar informados aqui."
    files:
      - name: team
        label: Membros
        icon: group
        file: content/_shared/data/team.yaml
        preview_path: /equipe/
        fields:
          - name: coordinators
            label: "Coordenadores"
            widget: object
            fields:
              - name: members
                label: "Coordenadores"
                label_singular: "Coordenador(a)"
                widget: list
                summary: "{{name}}"
                thumbnail: photo
                collapsed: auto
                fields: &faculty_fields
                  - {name: name, label: "Nome", hint: "Sem Prof./Profa.: o site acrescenta o prefixo."}
                  - name: gender
                    label: "Gênero"
                    widget: select
                    options:
                      - {label: "Masculino (Prof., Coordenador…)", value: m}
                      - {label: "Feminino (Profa., Coordenadora…)", value: f}
                    hint: "Define o prefixo e a forma do cargo."
                  - {name: role, label: "Cargo", widget: relation,
                     collection: conteudo, file: team_i18n, value_field: "{{roles.*.id}}",
                     display_fields: ["{{roles.*.m}} / {{roles.*.f}}"], search_fields: ["{{roles.*.m}}", "{{roles.*.f}}", "{{roles.*.id}}"],
                     hint: "Os cargos e suas traduções ficam em Conteúdo › Textos da equipe."}
                  - {name: email, label: "E-mail", required: false, type: email, hint: "Opcional. O e-mail dos coordenadores também aparece na página Contato."}
                  - {name: scholar_id, label: "ID do Google Scholar", required: false, pattern: ['^[A-Za-z0-9_-]+$', "Só o ID, ex.: L4nnrk8AAAAJ"], hint: "Opcional: o trecho `user=…` da URL do perfil, ex.: L4nnrk8AAAAJ. As publicações do site vêm daqui."}
                  - {name: lattes, label: "ID do Lattes", required: false, pattern: ['^\d{16}$', "Só os 16 dígitos, ex.: 0748942455194916"], hint: "Opcional: os 16 dígitos do endereço lattes.cnpq.br/…"}
                  - {name: website, label: "Site pessoal", required: false, pattern: ['^https?://', "Comece com https://"], hint: "Opcional: endereço completo (https://…)."}
                  - &photo_field
                    name: photo
                    label: "Foto"
                    widget: image
                    required: false
                    choose_url: false
                    accept: image/*
                    media_folder: /public/images/team
                    public_folder: /images/team
                    media_libraries:
                      all:
                        transformations:
                          raster_image: {format: webp, quality: 85, width: 800, height: 1000}
                    hint: "Opcional. Foto de rosto, de preferência quadrada; ao salvar, vira WebP com até 800 px de largura e um nome de arquivo sem acentos. Sem foto, o site mostra as iniciais."
                  - {name: tags, label: "Tags de pesquisa", widget: relation, multiple: true, required: false,
                     collection: equipe, file: team_tags, value_field: "{{tags.*.id}}",
                     display_fields: ["{{tags.*.pt}}"], search_fields: ["{{tags.*.pt}}", "{{tags.*.en}}", "{{tags.*.id}}"],
                     hint: "Opcional. Ligam o membro às áreas de pesquisa com as mesmas tags. Novas tags: Equipe › Tags de pesquisa."}
          - name: professors
            label: "Professores"
            widget: object
            fields:
              - name: members
                label: "Professores"
                label_singular: "Professor(a)"
                widget: list
                summary: "{{name}}"
                thumbnail: photo
                collapsed: auto
                fields: *faculty_fields
          - name: collaborators
            label: "Colaboradores externos"
            widget: object
            fields:
              - name: members
                label: "Colaboradores"
                label_singular: "Colaborador(a)"
                widget: list
                summary: "{{name}}"
                thumbnail: photo
                collapsed: auto
                fields: *faculty_fields
          - name: phd_students
            label: "Doutorandos"
            widget: object
            fields:
              - name: members
                label: "Doutorandos"
                label_singular: "Doutorando(a)"
                widget: list
                summary: "{{name}} ({{since}})"
                thumbnail: photo
                collapsed: auto
                fields: &student_fields
                  - {name: name, label: "Nome"}
                  - {name: since, label: "Ano de entrada", widget: number, value_type: int, min: 1990, max: 2100, hint: "Ex.: 2023. As publicações contam a partir deste ano."}
                  - {name: scholar_id, label: "ID do Google Scholar", required: false, pattern: ['^[A-Za-z0-9_-]+$', "Só o ID, ex.: DqnrCA8AAAAJ"], hint: "Opcional: o trecho `user=…` da URL do perfil. As publicações do site vêm daqui."}
                  - {name: lattes, label: "ID do Lattes", required: false, pattern: ['^\d{16}$', "Só os 16 dígitos, ex.: 4755584696921241"], hint: "Opcional: os 16 dígitos do endereço lattes.cnpq.br/…"}
                  - {name: website, label: "Site pessoal", required: false, pattern: ['^https?://', "Comece com https://"], hint: "Opcional: endereço completo (https://…)."}
                  - *photo_field
          - name: masters_students
            label: "Mestrandos"
            widget: object
            fields:
              - name: members
                label: "Mestrandos"
                label_singular: "Mestrando(a)"
                widget: list
                summary: "{{name}} ({{since}})"
                thumbnail: photo
                collapsed: auto
                fields: *student_fields
          - name: undergrads
            label: "Graduandos (iniciação científica)"
            widget: object
            fields:
              - name: members
                label: "Graduandos"
                label_singular: "Graduando(a)"
                widget: list
                summary: "{{name}} ({{since}})"
                thumbnail: photo
                collapsed: auto
                fields: *student_fields
          - name: alumni_grad
            label: "Egressos da pós-graduação"
            widget: object
            fields:
              - name: members
                label: "Egressos"
                label_singular: "Egresso(a)"
                widget: list
                hint: "Só os nomes."
                field: {name: name, label: "Nome"}
          - name: alumni_undergrad
            label: "Egressos da graduação"
            widget: object
            fields:
              - name: members
                label: "Egressos"
                label_singular: "Egresso(a)"
                widget: list
                hint: "Só os nomes."
                field: {name: name, label: "Nome"}

      - name: team_tags
        label: "Tags de pesquisa"
        icon: sell
        file: content/_shared/data/team_tags.yaml
        preview_path: /equipe/
        fields:
          - name: tags
            label: "Tags de pesquisa"
            label_singular: "Tag"
            widget: list
            root: true
            map_key_field: id
            summary: "{{pt}} · {{en}} · {{es}} · {{it}}"
            collapsed: auto
            hint: "Cada tag tem o nome nos quatro idiomas, lado a lado. Usadas pelos membros e pelas áreas de pesquisa."
            fields:
              - {name: id, label: "Identificador", pattern: ['^[a-z][a-z0-9_]*$', "Só letras minúsculas, números e _"], hint: "Curto, sem espaços nem acentos, ex.: machine_learning. Não mude o de uma tag em uso."}
              - {name: pt, label: "Português"}
              - {name: en, label: "Inglês"}
              - {name: es, label: "Espanhol"}
              - {name: it, label: "Italiano"}

  # ── Configurações: content/_shared/data/site.yaml ─────────────────────────────────────────────
  - name: configuracoes
    label: Configurações
    label_singular: Configuração
    icon: settings
    description: "Nome do laboratório, redes sociais e links institucionais, iguais em todos os idiomas."
    files:
      - name: site
        label: Site
        icon: settings
        file: content/_shared/data/site.yaml
        preview_path: /
        fields:
          - {name: name, label: "Nome completo", hint: "Ex.: CSI Lab · UFOP. Nome do site nas redes sociais e título de reserva das páginas."}
          - {name: short_name, label: "Nome curto", hint: "Ex.: CSI Lab."}
          - {name: years, label: "Anos de pesquisa", hint: "Texto do selo da página inicial, ex.: 16+."}
          - {name: map_url, label: "Link do mapa", required: false, pattern: ['^https?://', "Comece com https://"], hint: "Opcional: endereço do Google Maps (ou outro) para o link “ver no mapa” da página Contato; vazio, o link não aparece."}
          - name: social
            label: "Redes sociais"
            label_singular: "Rede social"
            widget: list
            map_key_field: id
            summary: "{{name}}"
            collapsed: auto
            hint: "Mostradas no rodapé e na página Contato, nesta ordem."
            fields:
              - name: id
                label: "Rede"
                widget: select
                options:
                  - {label: "Twitter / X", value: twitter}
                  - {label: "Instagram", value: instagram}
                  - {label: "GitHub", value: github}
                  - {label: "Google Scholar", value: scholar}
                  - {label: "Lattes", value: lattes}
                  - {label: "ORCID", value: orcid}
                hint: "Define o ícone."
              - {name: name, label: "Nome exibido", hint: "Ex.: Instagram."}
              - {name: handle, label: "Usuário", required: false, hint: "Opcional, ex.: @csilab_ufop."}
              - {name: url, label: "Endereço", pattern: ['^https?://', "Comece com https://"], hint: "Endereço completo (https://…)."}
          - name: institutions
            label: "Instituições"
            label_singular: "Instituição"
            widget: keyvalue
            key_label: "Sigla"
            value_label: "Endereço (https://…)"
            hint: "Links do rodapé e da página Contato, nesta ordem. Mantenha as siglas UFOP (também é o link do brasão do rodapé) e PPGCC (também é o link do cartão Mestrado e Doutorado na página Contato)."
